<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administració · Gestor d'avaluació</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="./html-utils.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="administrador.css">
</head>
<body class="admin-page">

  <div class="admin-shell">

    <header class="topbar">
      <div>
        <h1>⚙️ Administració d’usuaris</h1>
        <p class="lead">Gestiona l'accés i els permisos dels docents.</p>
      </div>
      <div class="toolbar">
        <button id="btnBackToApp" class="btn" type="button">← Tornar al gestor</button>
        <button id="btnLogout" class="btn btn-danger" type="button">Sortir</button>
      </div>
    </header>

    <section class="panel mb-6" style="overflow-x:auto">
      <h2 class="section-title" style="margin-bottom:1rem">Usuaris registrats</h2>
        <table>
          <thead>
            <tr>
              <th>Nom</th>
              <th>Email</th>
              <th>Data creació</th>
              <th>Admin</th>
              <th>Suspès</th>
              <th>Eliminat</th>
              <th>Accions</th>
            </tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      <div class="toolbar" style="margin-top:1rem">
        <button id="btnAddAdmin" class="btn btn-primary" type="button">Fer admin per email</button>
        <button id="btnMigrateOldUsers" class="btn" type="button">Migrar usuaris antics</button>
      </div>
    </section>

    <section class="panel" style="margin-top:1.2rem">
      <h2 class="section-title" style="margin-bottom:1rem">Últims 10 accessos per usuari</h2>
      <div id="lastLoginsContainer"></div>
    </section>

  </div>

  <script type="module" src="administrador.js"></script>
  <script type="module" src="administrador-enhancements.js"></script>

</body>
</html>
